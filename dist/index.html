<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111512">
    <meta name="description" content="提一盏纸灯，走进槐安客栈。在旧家书、铜镜与灯谜之间，寻找你的归途。中式民俗悬疑互动短篇《归灯》。">
    <title>归灯 · 槐安异闻录</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="preload" as="image" href="/assets/inn-exterior.webp" fetchpriority="high">
    <link rel="stylesheet" href="/style.css">
    <script src="/game.js" type="module"></script>
  </head>
  <body>
    <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-5-5 5 5-5 5"/></symbol>
      <symbol id="icon-book" viewBox="0 0 24 24"><path d="M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1Zm0 0v15"/></symbol>
      <symbol id="icon-sound" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5V4Zm4 4a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
      <symbol id="icon-muted" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5V4Zm5 5 6 6m0-6-6 6"/></symbol>
      <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
      <symbol id="icon-headphones" viewBox="0 0 24 24"><path d="M4 14v-3a8 8 0 0 1 16 0v3M4 12H3v7h4v-7H4Zm16 0h1v7h-4v-7h3Z"/></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="icon-back" viewBox="0 0 24 24"><path d="M20 12H5m5-5-5 5 5 5"/></symbol>
    </svg>

    <div class="world" aria-hidden="true"><div id="scene-image" class="scene-image"></div><div class="scene-shade"></div><div class="mist"></div><div class="grain"></div></div>
    <div class="site-shell">
      <header class="site-header">
        <button class="wordmark" id="home-button" aria-label="归灯，返回序章"><span class="brand-seal">归</span><span>归灯<small>GUI DENG</small></span></button>
        <nav class="top-nav" aria-label="主导航">
          <button class="nav-link active" id="prologue-button" aria-current="page">序章</button>
          <button class="nav-link" id="journal-button"><svg class="icon"><use href="#icon-book"/></svg><span>归客手记</span><span class="clue-count" id="clue-count" hidden>0</span></button>
          <button class="nav-link guide-link" id="guide-button">游玩须知</button>
        </nav>
        <button class="sound-button" id="sound-button" aria-pressed="false" aria-label="开启环境音"><svg class="icon"><use id="sound-icon" href="#icon-muted"/></svg><span id="sound-label">环境音：关</span></button>
      </header>

      <main id="main-content">
        <section class="home-screen screen" id="home-screen" aria-labelledby="home-title">
          <div class="home-copy">
            <p class="eyebrow"><span></span>中式民俗悬疑 · 互动短篇</p>
            <div class="title-lockup"><h1 id="home-title">归灯</h1><span class="title-seal" aria-label="槐安异闻">槐安<br>异闻</span></div>
            <p class="tagline">灯不灭，故人归。</p>
            <div class="story-intro"><p>离家多年，你收到一封没有署名的家书。</p><p>「七月半，提灯归。有人在老地方等你。」</p></div>
            <button class="primary-button enter-button" id="start-button"><span class="button-caption">启 · 序章</span><span id="start-label">提灯入巷</span><svg class="icon"><use href="#icon-arrow"/></svg></button>
            <div class="under-button"><button class="text-button" id="letter-button">展开那封家书 <span>↗</span></button><span class="playtime">约 5 分钟</span></div>
          </div>
          <aside class="almanac" aria-label="故事时节"><span class="almanac-date">农历七月十五</span><span class="almanac-good">宜<span>归家</span></span><span class="almanac-bad">忌<span>回头</span></span></aside>
          <div class="location-caption"><span class="location-cross" aria-hidden="true">+</span><div><span>槐安镇 · 旧客栈</span><small>子时 / 雾起</small></div></div>
          <div class="home-bottom"><p><svg class="icon"><use href="#icon-headphones"/></svg>戴上耳机，听见另一面的故事</p><span class="chapter-mark">第一夜 <span>01 / 01</span></span></div>
        </section>

        <section class="play-screen screen" id="play-screen" hidden aria-labelledby="scene-title">
          <div class="scene-topline"><button class="text-button" id="leave-scene"><svg class="icon"><use href="#icon-back"/></svg>返回序章</button><span id="scene-time">第一夜 · 子时</span></div>
          <div class="play-layout">
            <article class="narrative-panel">
              <p class="eyebrow" id="scene-eyebrow">壹 · 入巷</p>
              <h2 id="scene-title" tabindex="-1">有客来</h2>
              <div class="narrative-text" id="narrative-text"></div>
              <div class="task-box"><span class="task-marker" aria-hidden="true">◇</span><div><span class="task-label">此刻</span><p id="objective"></p></div></div>
              <div class="scene-actions" id="scene-actions"></div>
              <button class="text-button hint-button" id="hint-button">灯下求一签 <span>查看提示</span></button>
            </article>
            <div class="explore-area" id="explore-area" role="group" aria-label="场景中可探索的物品"></div>
          </div>
          <div class="play-bottom"><p id="scene-instruction">点击场景中的标记，寻找留下的线索。</p><button class="inventory-button" id="inventory-button"><svg class="icon"><use href="#icon-book"/></svg>归客手记<span id="inventory-count">0 件线索</span></button></div>
        </section>

        <section class="ending-screen screen" id="ending-screen" hidden aria-labelledby="ending-title">
          <div class="ending-content"><span class="ending-seal">归</span><p class="eyebrow">第一夜 · 终</p><h2 id="ending-title" tabindex="-1">灯火有归处</h2><p class="ending-subtitle">你终于知道，是谁一直在等。</p><div id="ending-story" class="ending-story"></div><div class="ending-actions"><button class="primary-button" id="replay-button">再赴槐安<svg class="icon"><use href="#icon-arrow"/></svg></button><button class="text-button" id="ending-journal">翻阅归客手记</button></div><p class="ending-footnote">有些灯，亮着就算团圆。</p></div>
        </section>
      </main>

      <footer class="site-footer"><span>槐安异闻录</span><ol class="chapter-track" aria-label="剧情进度"><li id="step-0" class="current">壹<span>入巷</span></li><li id="step-1">贰<span>叩门</span></li><li id="step-2">叁<span>归灯</span></li></ol><span class="footer-note">故事纯属虚构</span></footer>
    </div>

    <dialog id="story-dialog" class="story-dialog" aria-labelledby="dialog-title"><div class="dialog-inner"><div class="dialog-top"><span id="dialog-kicker">槐安异闻录</span><button class="icon-button" id="close-dialog" aria-label="关闭"><svg class="icon"><use href="#icon-close"/></svg></button></div><h2 id="dialog-title"></h2><div id="dialog-content"></div></div></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <noscript><div class="no-script">请在浏览器中开启 JavaScript，进入《归灯》的互动故事。</div></noscript>
  </body>
</html>
