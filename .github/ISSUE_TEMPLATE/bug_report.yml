name: 缺陷报告
description: 报告《归灯》里可以复现的错误
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索已有 issue。安全漏洞请走 [私人报告](https://github.com/TPB003/CN-Horror/security/advisories/new)，不要写在这里。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 实际发生了什么？
      placeholder: 进入第六站后，手记打不开。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你认为应该发生什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开站点并点击「举灯入巷」
        2. 进入某一站
        3. 执行某个操作
    validations:
      required: true
  - type: input
    id: chapter
    attributes:
      label: 章节或界面
      description: 已知时填写站点编号、结局或组件名称。
      placeholder: 06 纸扎店 / 开场 / 街区沙盘
  - type: dropdown
    id: area
    attributes:
      label: 相关区域
      options:
        - 剧情 / Ink
        - 界面
        - 声音
        - 三维街区
        - 小说导出
        - 素材
        - 史料与来源
        - 无障碍 / 键盘
        - 构建或本地运行
        - 不确定
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 浏览器、操作系统，以及桌面或手机视口。
      placeholder: Chrome 130 / Windows / 1440×900
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图、录屏或控制台信息
      description: 可直接粘贴图片。关键线索如果只能听见，请同时写出现象。
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 issue，这不是重复报告。
          required: true
        - label: 这不是安全漏洞。安全问题我会私下报告。
          required: true
