name: 功能建议
description: 提议新的体验、剧情、文档或维护改进
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请说明玩家或维护者能因此多做什么。史料类提议需要能核验的来源；创作转译请标明它不是典籍原文。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在缺了什么，或者哪里难用？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议
      description: 你希望改成什么样？涉及哪一站、组件或文档？
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 相关区域
      options:
        - 剧情 / Ink
        - 界面
        - 声音
        - 三维街区
        - 小说导出
        - 素材
        - 史料与来源
        - 无障碍 / 键盘
        - 文档
        - 构建或 CI
        - 其他
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法
      description: 没有的话写「无」。
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 史料或素材依据
      description: 若建议涉及历史、民俗、仪式或外部素材，请写题名、版本或机构和链接。纯交互建议可写「不适用」。
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 issue，这不是重复建议。
          required: true
